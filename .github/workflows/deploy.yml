name: Deploy to RMJ Server

# Runs on the self-hosted runner installed directly on the Windows Server at
# the shop. The runner already lives on the same machine as the live app, so
# this workflow doesn't use actions/checkout - it just tells git (already
# cloned at E:\Rmj-One) to fast-forward to what was just pushed, rebuilds the
# frontend web export, and restarts both NSSM services.
#
# Deploy is manual-only (workflow_dispatch), not triggered by every push to
# main. The dev machine and the live server are the same box, so an
# automatic on-push deploy meant every push - including mid-session,
# WIP pushes just to sync across devices - did a live `git reset --hard`
# (discarding any uncommitted work sitting in the working tree) plus a
# backend restart and frontend rebuild+swap, with no way to push code
# without also going live. Trigger a deploy explicitly (Actions tab ->
# "Run workflow", or `gh workflow run deploy.yml`) once you actually want
# what's on main to go live.
#
# Post-deploy verification is a smoke test only: it confirms the backend
# process actually came back up and is answering HTTP requests. It
# deliberately does NOT run backend/tests/*.py - that suite logs in as the
# real owner account and creates/deletes real employee records against
# whatever data your shop actually has, so it's not safe to run
# unattended on every deploy. Run it yourself manually when you want it
# (see backend/tests/README, or just `pytest tests/` with
# EXPO_PUBLIC_BACKEND_URL pointed at this server) - never as part of deploy.
on:
  workflow_dispatch: {}

jobs:
  # Runs on GitHub's own hosted runner (not the shop's Windows box) so a lint
  # failure never touches the live server. This is a fast static-analysis
  # gate only - it deliberately does NOT run backend/tests/*.py (see the
  # comment on the deploy job below for why) or frontend/backend unit
  # test suites; it exists to catch typos/syntax errors/broken imports
  # before they ever reach the shop.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend - flake8 (syntax errors + real bugs only)
        run: |
          cd backend
          python3 -m pip install --quiet flake8
          # .flake8 restricts this to E9 (syntax errors) + F (pyflakes: unused
          # imports/vars, undefined names) - see backend/.flake8 for why the
          # stylistic checks are off (this codebase's compact one-line-if
          # style would otherwise flag hundreds of pre-existing, deliberate lines).
          python3 -m flake8 .

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend - install
        run: cd frontend && npm ci

      - name: Frontend - typecheck
        run: cd frontend && npx tsc --noEmit -p .

      # Report-only for now: tsc (above) and flake8 are the hard correctness
      # gates. eslint runs but does NOT block the deploy, because the existing
      # codebase predates any lint CI and hasn't been verified eslint-clean -
      # gating on it could wedge the live deploy on pre-existing style
      # findings that have nothing to do with the change being shipped. Once
      # the repo is confirmed clean, drop `continue-on-error` to make it a
      # hard gate.
      - name: Frontend - lint (report-only)
        continue-on-error: true
        run: cd frontend && npm run lint

  tests:
    uses: ./.github/workflows/backend-tests.yml

  deploy:
    needs: [lint, tests]
    runs-on: self-hosted
    steps:
      - name: Pull latest and redeploy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'D:\RMJ-One\RMJ-One'
          cd $repo

          function Get-CleanServiceStatus($name) {
            # nssm.exe writes its status output as UTF-16LE. Depending on the
            # console's active code page, capturing it via PowerShell can come
            # back with embedded/garbled bytes that LOOK like "SERVICE_RUNNING"
            # when printed but fail a strict -eq/-ne comparison even after
            # .Trim(). Strip everything but letters/underscores before
            # comparing so stray whitespace, nulls, or CR/LF noise can't
            # cause a false negative.
            $raw = (nssm status $name | Out-String)
            return ($raw -replace '[^A-Za-z_]', '')
          }

          function Wait-ForServiceStatus($name, $wanted, $tries) {
            # Poll instead of a single fixed sleep+check - nssm restart/start
            # is asynchronous and how long the process takes to actually
            # settle varies. Retrying is more robust than guessing one sleep
            # duration that may or may not be long enough on a given day.
            for ($i = 1; $i -le $tries; $i++) {
              $status = Get-CleanServiceStatus $name
              Write-Host "  [$i/$tries] $name -> $status"
              if ($status -eq $wanted) { return }
              Start-Sleep -Seconds 2
            }
            throw "$name did not reach $wanted (last status: $status)"
          }

          Write-Host '--- git pull ---'
          $reqBefore = (git rev-parse HEAD:backend/requirements.txt)
          git fetch origin main
          git reset --hard origin/main

          # New Python packages: install only when requirements.txt changed, into
          # the backend's own venv (what the service runs - see ops/setup-new-pc.ps1).
          # Never fails the deploy: the app keeps working without a new optional
          # package (e.g. PDF previews just show "Open" instead).
          if ((git rev-parse HEAD:backend/requirements.txt) -ne $reqBefore) {
            Write-Host '--- requirements.txt changed: pip install ---'
            $venvPy = Join-Path $repo 'backend\.venv\Scripts\python.exe'
            if (Test-Path $venvPy) {
              & $venvPy -m pip install --quiet --disable-pip-version-check -r (Join-Path $repo 'backend\requirements.txt')
              if ($LASTEXITCODE -ne 0) { Write-Warning "pip install exited with $LASTEXITCODE - continuing" }
            } else {
              Write-Warning "No backend venv at $venvPy - skipping pip install"
            }
          }

          # Database backup twice a day: make sure the "RMJOne Mongo Backup" task
          # (ops/backup/backup-nightly.ps1) runs at 02:30 and 14:30. Only changes it
          # when it differs; never fails the deploy.
          try {
            $task = Get-ScheduledTask -TaskName 'RMJOne Mongo Backup' -ErrorAction Stop
            $starts = @($task.Triggers | ForEach-Object { $_.StartBoundary }) -join ' '
            if (@($task.Triggers).Count -ne 2 -or $starts -notmatch 'T02:30' -or $starts -notmatch 'T14:30') {
              $triggers = @((New-ScheduledTaskTrigger -Daily -At '02:30'), (New-ScheduledTaskTrigger -Daily -At '14:30'))
              Set-ScheduledTask -TaskName 'RMJOne Mongo Backup' -Trigger $triggers | Out-Null
              Write-Host '--- backup task now runs at 02:30 and 14:30 ---'
            }
          } catch {
            Write-Warning "Could not set the backup task's times: $($_.Exception.Message)"
          }

          # ---- What happened since the last deploy (read BEFORE restarting) ----
          # The deploy log can't easily be read from outside, so the important
          # bits are also posted as warnings on the run (visible in the Actions
          # summary and through the GitHub API): the backend's recent errors and
          # restarts, Windows sleep/crash events, and any watchdog crash reports.
          function Post-Warning($title, $text) {
            if (-not $text) { return }
            $t = ($text -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            for ($i = 0; $i -lt $t.Length -and $i -lt 12000; $i += 3800) {
              $len = [Math]::Min(3800, $t.Length - $i)
              Write-Host ("::warning title={0}::{1}" -f $title, $t.Substring($i, $len))
            }
          }
          try {
            $errLog = ((nssm get RMJOneBackend AppStderr | Out-String) -replace "`0", '').Trim()
            if ($errLog -and (Test-Path $errLog)) {
              $hits = Get-Content $errLog -Tail 4000 | Select-String -Pattern 'Traceback|Error|Exception|Killed|MemoryError|Started server process|Shutting down|Finished server process|Application startup' | Select-Object -Last 40
              Post-Warning 'Backend log (errors and restarts)' (($hits | ForEach-Object { $_.Line }) -join "`n")
            }
            $ev = Get-WinEvent -FilterHashtable @{ LogName = 'System'; StartTime = (Get-Date).AddDays(-2) } -ErrorAction SilentlyContinue |
              Where-Object { $_.Id -in 41, 42, 107, 6008, 1074 -or ($_.Level -le 2 -and $_.Message -match 'RMJOne|Cloudflared|MongoDB|nssm') } | Select-Object -First 30
            Post-Warning 'Windows events, last 2 days (sleep/wake, shutdowns, service errors)' (($ev | ForEach-Object { "{0:yyyy-MM-dd HH:mm}  {1} {2}: {3}" -f $_.TimeCreated, $_.ProviderName, $_.Id, (($_.Message -split "`n")[0]) }) -join "`n")
            $sleep = (powercfg /query SCHEME_CURRENT SUB_SLEEP STANDBYIDLE | Select-String 'Current AC Power Setting Index' | Out-String).Trim()
            Post-Warning 'PC sleep setting (0x00000000 = never sleeps)' $sleep
            $incDir = Join-Path $repo 'ops\logs\incidents'
            if (Test-Path $incDir) {
              Get-ChildItem $incDir -Filter *.txt | Where-Object { $_.LastWriteTime -gt (Get-Date).AddDays(-14) } | Sort-Object Name | Select-Object -Last 3 |
                ForEach-Object { Post-Warning "Watchdog report $($_.BaseName)" (Get-Content $_.FullName -Raw) }
            }
          } catch { Write-Warning "Could not collect diagnostics: $($_.Exception.Message)" }

          # ---- Keep the server up on its own ----
          # The backend and web services restart by themselves if they ever
          # exit, their logs rotate instead of growing forever, and the
          # "RMJOne Watchdog" task (ops/watchdog/rmj-watchdog.ps1) checks every
          # 2 minutes that the backend actually answers - restarting it (and
          # MongoDB / cloudflared) if not, with a crash report saved each time.
          # Never fails the deploy.
          foreach ($svc in @('RMJOneBackend', 'RMJOneWeb')) {
            foreach ($kv in @(@('AppExit', 'Default', 'Restart'), @('AppRestartDelay', '5000'), @('AppRotateFiles', '1'), @('AppRotateOnline', '1'), @('AppRotateBytes', '10485760'))) {
              try { & nssm set $svc @kv 2>&1 | Out-Null } catch { Write-Warning "nssm set $svc $($kv -join ' ') failed: $($_.Exception.Message)" }
            }
          }
          try {
            $wd = Join-Path $repo 'ops\watchdog\rmj-watchdog.ps1'
            $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$wd`" -Repo `"$repo`""
            $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1) -RepetitionInterval (New-TimeSpan -Minutes 2)
            $settings = New-ScheduledTaskSettingsSet -MultipleInstances IgnoreNew -ExecutionTimeLimit (New-TimeSpan -Minutes 5) -StartWhenAvailable -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
            Register-ScheduledTask -TaskName 'RMJOne Watchdog' -Action $action -Trigger $trigger -Settings $settings -User 'SYSTEM' -RunLevel Highest -Force | Out-Null
            Write-Host '--- watchdog task registered (every 2 minutes) ---'
          } catch {
            Write-Warning "Could not set up the watchdog: $($_.Exception.Message)"
          }

          Write-Host '--- restart backend ---'
          # `nssm restart` was observed to stop the service but not reliably
          # bring it back up on this box (confirmed: a plain `nssm start`
          # immediately after a failed `nssm restart` worked instantly). Do
          # an explicit stop-then-start instead, each polled to completion,
          # rather than trusting restart's internal stop->start handoff.
          nssm stop RMJOneBackend
          Wait-ForServiceStatus RMJOneBackend 'SERVICE_STOPPED' 10
          nssm start RMJOneBackend
          Wait-ForServiceStatus RMJOneBackend 'SERVICE_RUNNING' 10

          Write-Host '--- backend smoke test ---'
          # Pure read-only GET against the unauthenticated root route - confirms
          # the API is actually answering requests post-restart, no login and
          # no data mutation, so it's safe to run on every deploy.
          $ok = $false
          for ($i = 1; $i -le 10; $i++) {
            try {
              $resp = Invoke-RestMethod -Uri 'http://localhost:8000/api/' -TimeoutSec 5
              if ($resp.status -eq 'ok') { $ok = $true; break }
            } catch {
              Write-Host "  attempt $i failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            throw 'Backend smoke test failed: http://localhost:8000/api/ did not return {status: ok} after restart.'
          }
          Write-Host '  backend is up'

          Write-Host '--- rebuild frontend web export (into a temp dir, old site keeps serving) ---'
          # Building straight into `dist` meant the site was down (or serving a half-written
          # export) for however long `expo export` took, and a failed export left `dist`
          # deleted with nothing to restart into. Build into `dist-new` first while
          # RMJOneWeb keeps serving the current `dist` unchanged; only swap and restart the
          # service once the export has actually succeeded.
          $distPath = "$repo\frontend\dist"
          $newDistPath = "$repo\frontend\dist-new"
          $oldDistPath = "$repo\frontend\dist-old"
          foreach ($p in @($newDistPath, $oldDistPath)) {
            if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force }
          }
          cd "$repo\frontend"
          $env:EXPO_NO_TELEMETRY = '1'
          npx expo export --platform web --output-dir dist-new
          $exportExitCode = $LASTEXITCODE
          cd $repo
          if ($exportExitCode -ne 0 -or -not (Test-Path -LiteralPath "$newDistPath\index.html")) {
            if (Test-Path -LiteralPath $newDistPath) { Remove-Item -LiteralPath $newDistPath -Recurse -Force }
            throw "Frontend web export failed (exit code $exportExitCode) - RMJOneWeb was left untouched, still serving the previous build."
          }
          Write-Host '  export OK'

          Write-Host '--- swap in new web build and restart ---'
          nssm stop RMJOneWeb
          Wait-ForServiceStatus RMJOneWeb 'SERVICE_STOPPED' 10
          if (Test-Path -LiteralPath $distPath) { Rename-Item -LiteralPath $distPath -NewName 'dist-old' }
          Rename-Item -LiteralPath $newDistPath -NewName 'dist'
          if (Test-Path -LiteralPath $oldDistPath) { Remove-Item -LiteralPath $oldDistPath -Recurse -Force }
          nssm start RMJOneWeb
          Wait-ForServiceStatus RMJOneWeb 'SERVICE_RUNNING' 10

          Write-Host '--- done ---'
