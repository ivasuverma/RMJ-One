name: Backend tests

# Starts the backend against a throwaway MongoDB (it seeds its default demo
# users/employees on a fresh database) and runs backend/tests against it.
# Runs on every PR that touches the backend, and deploy.yml calls it so a
# deploy can't go out on failing tests. Tests listed in
# backend/tests/conftest.py (NEEDS_REVIEW) are skipped with their reason.
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: rmj_ci
      EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8001
      WHATSAPP_WEBHOOK_SECRET: ci-webhook-secret   # test-only; lets tests sign OpenWA webhook calls
      META_WA_APP_SECRET: ci-meta-secret           # test-only; lets tests sign Meta webhook calls
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 8001 > ../uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/api/ && exit 0
            sleep 2
          done
          cat ../uvicorn.log; exit 1

      - name: Run tests (serially — several suites share seeded state)
        working-directory: backend
        run: python -m pytest tests -n 0 -q -rs

      - name: Backend log on failure
        if: failure()
        run: tail -100 uvicorn.log
