name: Deploy website to Cloudflare Pages

# The public rmj.co.in marketing site (plain static HTML/CSS/JS in website/,
# see website/README.md) - completely separate from the shop app in
# frontend/ and backend/, and from deploy.yml, which only ever touches the
# self-hosted Windows box. This one runs on GitHub's own runner and pushes
# straight to Cloudflare Pages, so it's safe to run automatically on every
# push, unlike deploy.yml's manual-only trigger.
#
# Uses cloudflare/wrangler-action (running `wrangler pages deploy`), NOT
# cloudflare/pages-action - that was Cloudflare's original, simpler Pages
# action, but it was fully retired and removed from GitHub (archived October
# 2024). The first two real runs of this workflow failed at "Set up job"
# with "Unable to resolve action `cloudflare/pages-action`, not found" -
# nothing to do with secrets or permissions, the action just doesn't exist
# on GitHub anymore. wrangler-action is Cloudflare's current, supported
# replacement for both Workers and Pages deploys.
#
# One-time setup before this can run:
#   1. In the Cloudflare dashboard (the same account already used for the
#      app.rmj.co.in / api.rmj.co.in tunnel), create an API token with the
#      "Cloudflare Pages - Edit" permission (My Profile -> API Tokens ->
#      Create Token), and note the Account ID (right sidebar of any zone's
#      Overview page).
#   2. In this repo's Settings -> Secrets and variables -> Actions, add:
#        CLOUDFLARE_API_TOKEN   = the token from step 1
#        CLOUDFLARE_ACCOUNT_ID  = the account ID from step 1
#   3. The "Ensure Cloudflare Pages project exists" step below creates the
#      project named below on the very first run (and harmlessly no-ops on
#      every run after, once it already exists - unlike the old, retired
#      pages-action, wrangler's `pages deploy` does NOT auto-create a
#      missing project, it just fails). After the first successful deploy,
#      in the Pages project's Custom domains tab, add rmj.co.in and
#      www.rmj.co.in - Cloudflare wires up the DNS records itself since the
#      zone is already on this account.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Confirmed by the first real deploy attempt: wrangler's `pages deploy`
      # errors out ("The Pages project ... does not exist") instead of
      # creating a missing project, unlike the old pages-action. This step
      # creates it — continue-on-error because `pages project create` itself
      # errors on every run AFTER the first (project already exists), which
      # is expected and fine; either way the next step runs.
      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create rmj-website --production-branch=main

      # No gitHubToken input, and no `permissions:` block — both are only
      # needed to also post a GitHub Deployment status alongside the
      # Cloudflare publish, which isn't required for the publish itself to
      # work and needs a `deployments: write` permission this repo's default
      # Actions permissions may not grant.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=rmj-website
